#####
# Jackson 2.x to 3.x migration
# See https://github.com/openrewrite/rewrite-jackson
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.core.quarkus40.Jackson3Migration
displayName: Migrate Jackson from 2.x to 3.x
description: >-
  Jackson 3.x uses new package names (tools.jackson instead of com.fasterxml.jackson),
  new group IDs, and includes various API changes. This recipe applies the OpenRewrite
  Jackson 2 to 3 migration.
recipeList:
  - org.openrewrite.java.jackson.UpgradeJackson_2_3

#####
# Hibernate ORM property renames
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.core.quarkus40.HibernateORMConfigProperties
displayName: Rename deprecated Hibernate ORM configuration properties
description: >-
  Rename Hibernate ORM configuration properties that were deprecated in Quarkus 3.x
  and removed in Quarkus 4.0.
recipeList:
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.batch-fetch-size
      newPropertyKey: quarkus.hibernate-orm.fetch.batch-size
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.batch-fetch-size
      newPropertyKey: quarkus.hibernate-orm.$1.fetch.batch-size
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.max-fetch-depth
      newPropertyKey: quarkus.hibernate-orm.fetch.max-depth
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.max-fetch-depth
      newPropertyKey: quarkus.hibernate-orm.$1.fetch.max-depth
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.log\.bind-param
      newPropertyKey: quarkus.hibernate-orm.log.bind-parameters
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.log\.bind-param
      newPropertyKey: quarkus.hibernate-orm.$1.log.bind-parameters
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.multitenant-schema-datasource
      newPropertyKey: quarkus.hibernate-orm.datasource
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.multitenant-schema-datasource
      newPropertyKey: quarkus.hibernate-orm.$1.datasource
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.dialect\.storage-engine
      newPropertyKey: quarkus.hibernate-orm.dialect.mysql.storage-engine
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.dialect\.storage-engine
      newPropertyKey: quarkus.hibernate-orm.$1.dialect.mysql.storage-engine

