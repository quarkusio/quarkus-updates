#####
# ArC - @DefaultBean to @Reserve migration
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.core.quarkus40.ArcDefaultBeanToReserve
displayName: Replace @DefaultBean with @Reserve
description: >-
  Replace ArC's @DefaultBean annotation with CDI 5.0's @Reserve annotation
  and add @Priority(0) if not already present. Also replace InjectableBean.isDefaultBean()
  with Bean.isReserve().
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.quarkus.arc.DefaultBean
      newFullyQualifiedTypeName: jakarta.enterprise.inject.Reserve
  - io.quarkus.updates.core.quarkus40.AddPriorityToReserveAnnotation

