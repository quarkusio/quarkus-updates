#####
# Micrometer Prometheus registry - Prometheus client 1.x
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.core.quarkus40.MicrometerPrometheusMetrics
displayName: Migrate to the Prometheus client 1.x based Micrometer registry
description: >-
  Quarkus 4.0 switches from `micrometer-registry-prometheus-simpleclient` to `micrometer-registry-prometheus`,
  whose classes live in the `io.micrometer.prometheusmetrics` package and use `PrometheusRegistry`
  instead of `CollectorRegistry`.
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.micrometer.prometheus
      newPackageName: io.micrometer.prometheusmetrics
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: io.prometheus.client.CollectorRegistry <constructor>(boolean)
      argumentIndex: 0
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.prometheus.client.CollectorRegistry
      newFullyQualifiedTypeName: io.prometheus.metrics.model.registry.PrometheusRegistry

