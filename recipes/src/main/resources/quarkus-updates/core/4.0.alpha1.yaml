      newPropertyKey: quarkus.hibernate-orm.fetch.batch-size
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.batch-fetch-size
      newPropertyKey: quarkus.hibernate-orm.$1.fetch.batch-size
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.max-fetch-depth
      newPropertyKey: quarkus.hibernate-orm.fetch.max-depth
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.max-fetch-depth
      newPropertyKey: quarkus.hibernate-orm.$1.fetch.max-depth
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.log\.bind-param
      newPropertyKey: quarkus.hibernate-orm.log.bind-parameters
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.log\.bind-param
      newPropertyKey: quarkus.hibernate-orm.$1.log.bind-parameters
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.multitenant-schema-datasource
      newPropertyKey: quarkus.hibernate-orm.datasource
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.multitenant-schema-datasource
      newPropertyKey: quarkus.hibernate-orm.$1.datasource
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.dialect\.storage-engine
      newPropertyKey: quarkus.hibernate-orm.dialect.mysql.storage-engine
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.dialect\.storage-engine
      newPropertyKey: quarkus.hibernate-orm.$1.dialect.mysql.storage-engine
  # Already handled in 3.23 but only applied when updating from < 3.23,
  # so we need to apply it again as the old properties have been removed in 4.0
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.database\.generation
      newPropertyKey: quarkus.hibernate-orm.schema-management.strategy
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.database\.generation\.create-schemas
      newPropertyKey: quarkus.hibernate-orm.schema-management.create-schemas
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.database\.generation\.halt-on-error
      newPropertyKey: quarkus.hibernate-orm.schema-management.halt-on-error
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.database\.generation
      newPropertyKey: quarkus.hibernate-orm.$1.schema-management.strategy
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.database\.generation\.create-schemas
      newPropertyKey: quarkus.hibernate-orm.$1.schema-management.create-schemas
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.database\.generation\.halt-on-error
      newPropertyKey: quarkus.hibernate-orm.$1.schema-management.halt-on-error
  - org.openrewrite.quarkus.ChangeQuarkusPropertyValue:
      propertyKey: quarkus\.hibernate-orm\.(.+\.)?database\.globally-quoted-identifiers
      oldValue: 'true'
      newValue: all
  - org.openrewrite.quarkus.ChangeQuarkusPropertyValue:
      propertyKey: quarkus\.hibernate-orm\.(.+\.)?database\.globally-quoted-identifiers
      oldValue: 'false'
      newValue: none
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.database\.globally-quoted-identifiers
      newPropertyKey: quarkus.hibernate-orm.quote-identifiers.strategy
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.hibernate-orm\.(.+)\.database\.globally-quoted-identifiers
      newPropertyKey: quarkus.hibernate-orm.$1.quote-identifiers.strategy

