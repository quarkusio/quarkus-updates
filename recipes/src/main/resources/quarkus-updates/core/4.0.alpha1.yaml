#####
# Quarkus Data Hibernate - stateless renamed to record
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.core.quarkus40.DataHibernateRecordRenames
displayName: Rename Quarkus Data Hibernate stateless types and accessors
description: >-
  Move types from `io.quarkus.data.hibernate.stateless` to `io.quarkus.data.hibernate.record`, and rename the
  `managedBlocking()`, `statelessBlocking()` and `statelessReactive()` switchers to `managed()`, `record()` and `recordReactive()`.
  References to generated default repository types still need to be updated after recompiling.
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.quarkus.data.hibernate.stateless
      newPackageName: io.quarkus.data.hibernate.record
      recursive: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.quarkus.data.hibernate.EntitySwitcher managedBlocking()
      newMethodName: managed
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.quarkus.data.hibernate.EntitySwitcher statelessBlocking()
      newMethodName: record
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.quarkus.data.hibernate.EntitySwitcher statelessReactive()
      newMethodName: recordReactive
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.quarkus.data.hibernate.RepositorySwitcher managedBlocking()
      newMethodName: managed
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.quarkus.data.hibernate.RepositorySwitcher statelessBlocking()
      newMethodName: record
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.quarkus.data.hibernate.RepositorySwitcher statelessReactive()
      newMethodName: recordReactive
      matchOverrides: true

