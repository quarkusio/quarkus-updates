#####
# Rules coming from https://docs.quarkiverse.io/quarkus-cxf/dev/release-notes/3.20.0.html
#####
type: specs.openrewrite.org/v1beta/recipe
name: io.quarkus.updates.cxf.cxf320.UpdateAll
displayName: Migrate quarkus-cxf to 3.20
description: >-
  Renames the deprecated client authentication properties quarkus.cxf.client."client-name".username
  and quarkus.cxf.client."client-name".password to auth.username and auth.password for
  quarkus-cxf 3.20.0.
recipeList:
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.cxf\.client\.([^.]+)\.username
      newPropertyKey: quarkus.cxf.client.$1.auth.username
      changeAllProfiles: true
  - org.openrewrite.quarkus.ChangeQuarkusPropertyKey:
      oldPropertyKey: quarkus\.cxf\.client\.([^.]+)\.password
      newPropertyKey: quarkus.cxf.client.$1.auth.password
      changeAllProfiles: true
